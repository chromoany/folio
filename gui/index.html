<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio · Markdown → PDF</title>
<link rel="icon" type="image/png" href="/icon.png">
<script>
// 首屏前先定主题，避免系统为深色时闪一下白底。
// 设置里的选择缓存在 localStorage（下次启动即时生效），稍后由 /api/settings 校正为权威值。
(function () {
  try {
    var p = localStorage.getItem('folio.theme');
    var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  } catch (_) {}
})();
</script>
<style>
  /* ---- 主题变量 ----
     默认（无 data-theme 或 data-theme="light"）为浅色，data-theme="dark" 为黑夜模式。
     界面所有颜色都从这些变量取，别处不要写死颜色，否则黑夜模式下会出现底/字撞色。
     --bg 需与 desktop/main.js 的 THEME_BG 保持一致（窗口初始背景色，避免启动闪白）。 */
  :root {
    color-scheme: light;
    --accent: #2f6feb;            /* 主色（按钮、强调文字） */
    --accent-hover: #2457c7;
    --accent-soft: #f0f5ff;       /* 拖拽高亮底色 */
    --accent-ring: rgba(47,111,235,.18);
    --accent-disabled: #a9c2f2;
    --on-accent: #fff;            /* 主色之上的文字 */
    --on-accent-disabled: #fff;   /* 禁用态主按钮文字（浅色与 --on-accent 一致，外观不变） */
    --bg: #f5f6f8;                /* 页面底色 */
    --card: #fff;                 /* 卡片底色 */
    --field: #fff;                /* 输入框 / 下拉框底色 */
    --soft: #fafbfc;              /* 次级面（文件列表项） */
    --line: #e3e6ea;              /* 分隔线 / 卡片描边 */
    --dash: #8b93a1;              /* 拖拽区虚线 */
    --txt: #1a1d21;               /* 正文 */
    --mut: #636d7a;               /* 次要文字 */
    --ghost-bg: #eef0f3;          /* 次要按钮 */
    --ghost-hover: #e0e4ea;
    --ghost-txt: #333;
    --danger-bg: #fde2e2;         /* 删除按钮悬停 */
    --danger-txt: #b8342a;
    --log-bg: #1e2430;            /* 日志框 */
    --log-txt: #d6e2f5;
    --ok-bg: #f2faf3;             /* 转换成功提示 */
    --ok-line: #cfe6cf;
    --ok-txt: #1e7d32;
    --mask: rgba(15,20,30,.42);   /* 弹窗遮罩 */
    --shadow-card: 0 1px 2px rgba(0,0,0,.03);
    --shadow-modal: 0 12px 48px rgba(0,0,0,.25);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --accent: #6f9bff;
    --accent-hover: #8bb0ff;
    --accent-soft: rgba(111,155,255,.14);
    --accent-ring: rgba(111,155,255,.28);
    --accent-disabled: #3c4762;
    --on-accent: #0d1017;
    --on-accent-disabled: #b4bac4; /* 深色禁用态用灰字，避免深字压深底 */
    --bg: #16181d;
    --card: #1e2127;
    --field: #23272f;
    --soft: #252a33;
    --line: #343a44;
    --dash: #6b7480;
    --txt: #e6e9ee;
    --mut: #9aa3b0;
    --ghost-bg: #2b303a;
    --ghost-hover: #363c47;
    --ghost-txt: #d7dbe2;
    --danger-bg: rgba(229,90,74,.2);
    --danger-txt: #ff8f80;
    --log-bg: #101319;
    --log-txt: #c9d4e3;
    --ok-bg: rgba(63,185,80,.12);
    --ok-line: rgba(63,185,80,.35);
    --ok-txt: #56d364;
    --mask: rgba(0,0,0,.62);
    --shadow-card: 0 1px 2px rgba(0,0,0,.35);
    --shadow-modal: 0 12px 48px rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: var(--txt); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
  header h1 { font-size: 22px; margin: 0; }
  header p { color: var(--mut); margin: 6px 0 0; font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 16px; box-shadow: var(--shadow-card); }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .drop { border: 2px dashed var(--dash); border-radius: 10px; padding: 26px 16px; text-align: center; color: var(--mut); cursor: pointer; transition: .15s; }
  .drop.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .drop b { color: var(--accent); }
  #fileInput { display: none; }
  .flist { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .fitem { display: flex; align-items: center; gap: 8px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
  .fitem .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fitem .idx { color: var(--mut); font-size: 12px; width: 20px; text-align: right; }
  .fitem button { border: 0; background: var(--ghost-bg); border-radius: 5px; cursor: pointer; padding: 3px 7px; font-size: 12px; color: var(--ghost-txt); }
  .fitem button:hover { background: var(--ghost-hover); }
  .fitem button.del:hover { background: var(--danger-bg); color: var(--danger-txt); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12px; color: var(--mut); }
  input[type=text], input[type=number], select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; width: 100%; background: var(--field); color: var(--txt); }
  input[type=text]:focus, input[type=number]:focus, select:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
  input::placeholder { color: var(--mut); opacity: .8; }
  .checks { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-size: 13px; margin-top: 4px; }
  .checks label { display: flex; align-items: center; gap: 6px; color: var(--txt); }
  .checks input { accent-color: var(--accent); }
  .btn { border: 0; border-radius: 10px; padding: 13px 22px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn.primary { background: var(--accent); color: var(--on-accent); width: 100%; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.primary:disabled { background: var(--accent-disabled); color: var(--on-accent-disabled); cursor: not-allowed; }
  .btn.ghost { background: var(--ghost-bg); color: var(--ghost-txt); }
  .btn.ghost:hover { background: var(--ghost-hover); }
  .result { display: none; margin-top: 16px; border: 1px solid var(--ok-line); background: var(--ok-bg); border-radius: 10px; padding: 14px 16px; }
  .result .ok { color: var(--ok-txt); font-weight: 600; margin-bottom: 8px; }
  .result .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  #log { display: none; margin-top: 16px; background: var(--log-bg); color: var(--log-txt); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-family: Consolas, monospace; font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; max-height: 260px; overflow: auto; }
  .hint { color: var(--mut); font-size: 12px; margin-top: 8px; }
  /* 右上角设置角标 + 弹窗 */
  header { position: relative; padding-right: 46px; }
  .gear { position: absolute; top: 0; right: 0; width: 36px; height: 36px; border: 0; border-radius: 9px; background: transparent; color: var(--mut); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .gear:hover { background: var(--ghost-bg); color: var(--txt); }
  .gear svg { width: 19px; height: 19px; }
  .modal-mask { display: none; position: fixed; inset: 0; z-index: 60; background: var(--mask); align-items: center; justify-content: center; padding: 20px; }
  .modal-mask.open { display: flex; }
  .modal { background: var(--card); color: var(--txt); border: 1px solid var(--line); border-radius: 14px; width: min(440px, 100%); padding: 20px; box-shadow: var(--shadow-modal); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head b { font-size: 16px; }
  .modal-close { border: 0; background: var(--ghost-bg); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 18px; line-height: 1; color: var(--ghost-txt); }
  .modal-close:hover { background: var(--ghost-hover); }
  .modal .field + .field { margin-top: 12px; }
  /* 设置弹窗底部版本号：与上方设置项用细线隔开，弱化为辅助信息 */
  .modal-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--mut); font-size: 12px; }
  .modal-foot .ver { font-family: Consolas, monospace; color: var(--txt); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Folio <span style="font-weight:400;color:var(--mut)" data-i18n="tagline">· Markdown → 书式 PDF</span></h1>
    <p data-i18n="intro">生成带目录、真实页码、可点击跳转的 PDF；目录里能查到每一节的页码</p>
    <button class="gear" id="settingsBtn" data-i18n-title="settingsBtn" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </header>

  <div class="card">
    <h2 data-i18n="step1Card">① 选择 Markdown 文件（可多选，顺序即章节顺序）</h2>
    <div class="drop" id="drop" data-i18n-html="dropHtml">把 <b>.md 文件拖到这里</b>，或点击选择</div>
    <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple>
    <div class="flist" id="flist"></div>
  </div>

  <div class="card">
    <h2 data-i18n="step2Card">② 选项</h2>
    <div class="grid">
      <div class="field"><label data-i18n="lblTitle">书名</label><input type="text" id="title" data-i18n-ph="phTitle" placeholder="留空则不生成书名页"></div>
      <div class="field"><label data-i18n="lblSubtitle">副标题</label><input type="text" id="subtitle" data-i18n-ph="phSubtitle" placeholder="可选"></div>
      <div class="field"><label data-i18n="lblTocDepth">目录深度（列到几级标题）</label>
        <select id="tocDepth">
          <option value="1" data-i18n="toc1">1 级（仅章）</option>
          <option value="2" data-i18n="toc2">2 级（章 + 节）</option>
          <option value="3" selected data-i18n="toc3">3 级（章 + 节 + 小节）</option>
          <option value="4" data-i18n="toc4">4 级</option>
        </select>
      </div>
      <div class="field"><label data-i18n="lblOutput">输出 PDF 路径（留空则下载）</label><input type="text" id="output" data-i18n-ph="phOutput" placeholder="如 D:\...\书.pdf"></div>
      <div class="field full">
        <div class="checks">
          <label><input type="checkbox" id="toc" checked> <span data-i18n="chkToc">生成目录</span></label>
          <label><input type="checkbox" id="chapterBreak" checked> <span data-i18n="chkBreak">每章（H1）另起一页</span></label>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="step3Card">③ 转换</h2>
    <button class="btn primary" id="go" data-i18n="goBtn" disabled>开始转换</button>
    <div class="hint" id="hint"></div>
    <div class="result" id="result"></div>
    <div id="log"></div>
  </div>

  <div class="modal-mask" id="settingsMask">
    <div class="modal">
      <div class="modal-head">
        <b data-i18n="settingsTitle">设置</b>
        <button class="modal-close" id="settingsClose" data-i18n-title="closeBtnTitle" title="关闭">×</button>
      </div>
      <div class="field">
        <label data-i18n="lblTheme">外观主题</label>
        <select id="themeSel">
          <option value="system" data-i18n="optThemeSystem">跟随系统</option>
          <option value="light" data-i18n="optThemeLight">浅色</option>
          <option value="dark" data-i18n="optThemeDark">深色（黑夜模式）</option>
        </select>
        <div class="hint" data-i18n="themeHint">即时生效。「跟随系统」随 Windows 的深色/浅色设置自动切换；主题只改变软件界面，不影响生成的 PDF。</div>
      </div>
      <div class="field">
        <label data-i18n="lblClose">关闭窗口时</label>
        <select id="closeBehavior">
          <option value="tray" data-i18n="optTray">收起至系统托盘（后台继续运行）</option>
          <option value="quit" data-i18n="optQuit">直接退出程序</option>
        </select>
        <div class="hint" data-i18n="closeHint">仅桌面版生效：点窗口右上角「×」时按此处理；最小化仍进任务栏。</div>
      </div>
      <div class="field">
        <label data-i18n="lblLang">语言</label>
        <select id="languageSel">
          <option value="zh" data-i18n="optZh">中文</option>
          <option value="en" data-i18n="optEn">English</option>
        </select>
        <div class="hint" data-i18n="langHint">语言即时生效，托盘菜单与系统弹窗同步切换。</div>
      </div>
      <div class="modal-foot">
        <span data-i18n="lblVersion">版本</span>
        <span class="ver" id="appVersion">—</span>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const LANGS = {
    zh: {
      docTitle: 'Folio · Markdown → PDF',
      tagline: '· Markdown → 书式 PDF',
      intro: '生成带目录、真实页码、可点击跳转的 PDF；目录里能查到每一节的页码',
      settingsBtn: '设置',
      settingsTitle: '设置',
      closeBtnTitle: '关闭',
      step1Card: '① 选择 Markdown 文件（可多选，顺序即章节顺序）',
      dropHtml: '把 <b>.md 文件拖到这里</b>，或点击选择',
      step2Card: '② 选项',
      lblTitle: '书名',
      phTitle: '留空则不生成书名页',
      lblSubtitle: '副标题',
      phSubtitle: '可选',
      lblTocDepth: '目录深度（列到几级标题）',
      toc1: '1 级（仅章）',
      toc2: '2 级（章 + 节）',
      toc3: '3 级（章 + 节 + 小节）',
      toc4: '4 级',
      lblOutput: '输出 PDF 路径（留空则下载）',
      phOutput: '如 D:\\...\\书.pdf',
      chkToc: '生成目录',
      chkBreak: '每章（H1）另起一页',
      step3Card: '③ 转换',
      goBtn: '开始转换',
      lblTheme: '外观主题',
      optThemeSystem: '跟随系统',
      optThemeLight: '浅色',
      optThemeDark: '深色（黑夜模式）',
      themeHint: '即时生效。「跟随系统」随 Windows 的深色/浅色设置自动切换；主题只改变软件界面，不影响生成的 PDF。',
      lblClose: '关闭窗口时',
      optTray: '收起至系统托盘（后台继续运行）',
      optQuit: '直接退出程序',
      closeHint: '仅桌面版生效：点窗口右上角「×」时按此处理；最小化仍进任务栏。',
      lblLang: '语言',
      optZh: '中文',
      optEn: 'English',
      langHint: '语言即时生效，托盘菜单与系统弹窗同步切换。',
      lblVersion: '版本',
      up: '上移',
      down: '下移',
      del: '移除',
      filesSelected: (n) => (n ? `已选 ${n} 个文件` : ''),
      preparing: '准备中…',
      uploading: '上传并转换中…',
      convFail: '转换失败',
      errPrefix: '出错：',
      okSaved: (p) => `✓ 转换完成，已保存到 ${p}`,
      okSize: (k) => `✓ 转换完成（${k} KB）`,
      openPdf: '打开 PDF',
      openFolder: '打开所在文件夹',
      downloadPdf: '下载 PDF',
    },
    en: {
      docTitle: 'Folio · Markdown → PDF',
      tagline: '· Markdown → Book PDF',
      intro: 'Create a PDF with a clickable table of contents and real page numbers',
      settingsBtn: 'Settings',
      settingsTitle: 'Settings',
      closeBtnTitle: 'Close',
      step1Card: '① Select Markdown files (multi-select — order = chapter order)',
      dropHtml: 'Drag &amp; drop <b>.md files here</b>, or click to select',
      step2Card: '② Options',
      lblTitle: 'Book title',
      phTitle: 'Leave empty to skip the title page',
      lblSubtitle: 'Subtitle',
      phSubtitle: 'Optional',
      lblTocDepth: 'TOC depth (levels to list)',
      toc1: 'Level 1 (chapters only)',
      toc2: 'Level 2 (chapters + sections)',
      toc3: 'Level 3 (chapters + sections + subsections)',
      toc4: 'Level 4',
      lblOutput: 'Output PDF path (leave empty to download)',
      phOutput: 'e.g. D:\\...\\book.pdf',
      chkToc: 'Table of contents',
      chkBreak: 'Each chapter (H1) starts a new page',
      step3Card: '③ Convert',
      goBtn: 'Convert',
      lblTheme: 'Theme',
      optThemeSystem: 'Follow system',
      optThemeLight: 'Light',
      optThemeDark: 'Dark',
      themeHint: 'Applies instantly. “Follow system” matches your Windows light/dark setting. The theme only changes this app’s interface — the generated PDF is unaffected.',
      lblClose: 'When closing the window',
      optTray: 'Minimize to tray (keep running in background)',
      optQuit: 'Quit the app',
      closeHint: 'Desktop only: applies when clicking the “×” button; minimizing still goes to the taskbar.',
      lblLang: 'Language',
      optZh: '中文',
      optEn: 'English',
      langHint: 'Applies immediately — tray menu and system dialogs switch too.',
      lblVersion: 'Version',
      up: 'Move up',
      down: 'Move down',
      del: 'Remove',
      filesSelected: (n) => (n ? `${n} file(s) selected` : ''),
      preparing: 'Preparing…',
      uploading: 'Uploading and converting…',
      convFail: 'Conversion failed',
      errPrefix: 'Error: ',
      okSaved: (p) => `✓ Conversion complete — saved to ${p}`,
      okSize: (k) => `✓ Conversion complete (${k} KB)`,
      openPdf: 'Open PDF',
      openFolder: 'Open containing folder',
      downloadPdf: 'Download PDF',
    },
  };

  let cur = 'zh';

  function t(key, ...args) {
    const v = (LANGS[cur] || LANGS.zh)[key];
    return typeof v === 'function' ? v(...args) : (v !== undefined ? v : key);
  }

  // 应用语言到所有带 data-i18n* 的静态元素
  function applyLang(lang) {
    cur = lang === 'en' ? 'en' : 'zh';
    document.documentElement.lang = cur === 'zh' ? 'zh-CN' : 'en';
    document.title = t('docTitle');
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t(el.dataset.i18nTitle); });
    const langSel = document.getElementById('languageSel');
    if (langSel) langSel.value = cur;
    renderList();
  }

  // ---- 主题（浅色 / 深色 / 跟随系统）----
  const THEME_KEY = 'folio.theme';   // 与 <head> 首屏脚本共用：下次启动免闪白
  let themePref = 'system';          // 用户选择：'system' | 'light' | 'dark'
  const isDarkOS = () => {
    try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch (_) { return false; }
  };

  function applyTheme(pref, persist) {
    themePref = (pref === 'light' || pref === 'dark') ? pref : 'system';
    const theme = themePref === 'system' ? (isDarkOS() ? 'dark' : 'light') : themePref;
    const root = document.documentElement;
    root.dataset.theme = theme;
    root.style.colorScheme = theme;   // 让滚动条 / 下拉列表等原生控件同色，避免底色与文字撞色
    const sel = document.getElementById('themeSel');
    if (sel) sel.value = themePref;
    try { localStorage.setItem(THEME_KEY, themePref); } catch (_) {}
    if (persist) postSettings({ theme: themePref });
  }

  // 系统深浅色变化时，「跟随系统」需实时跟随
  try {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const onSystemTheme = () => { if (themePref === 'system') applyTheme('system', false); };
    if (mq.addEventListener) mq.addEventListener('change', onSystemTheme);
    else if (mq.addListener) mq.addListener(onSystemTheme);
  } catch (_) {}

  const drop = document.getElementById('drop');
  const input = document.getElementById('fileInput');
  const flist = document.getElementById('flist');
  const go = document.getElementById('go');
  const hint = document.getElementById('hint');
  const result = document.getElementById('result');
  const logEl = document.getElementById('log');

  let files = [];

  drop.addEventListener('click', () => input.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault(); drop.classList.remove('drag');
    addFiles([...e.dataTransfer.files]);
  });
  input.addEventListener('change', () => { addFiles([...input.files]); input.value = ''; });

  function addFiles(arr) {
    const md = arr.filter((f) => /\.(md|markdown|txt)$/i.test(f.name));
    if (md.length) { files = files.concat(md); renderList(); }
  }

  function renderList() {
    flist.innerHTML = '';
    files.forEach((f, i) => {
      const it = document.createElement('div');
      it.className = 'fitem';
      const idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = i + 1 + '.';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = f.name;
      const up = document.createElement('button'); up.textContent = '↑'; up.title = t('up');
      const dn = document.createElement('button'); dn.textContent = '↓'; dn.title = t('down');
      const del = document.createElement('button'); del.textContent = '×'; del.className = 'del'; del.title = t('del');
      up.onclick = () => { if (i > 0) { [files[i - 1], files[i]] = [files[i], files[i - 1]]; renderList(); } };
      dn.onclick = () => { if (i < files.length - 1) { [files[i + 1], files[i]] = [files[i], files[i + 1]]; renderList(); } };
      del.onclick = () => { files.splice(i, 1); renderList(); };
      it.append(idx, nm, up, dn, del);
      flist.appendChild(it);
    });
    go.disabled = files.length === 0;
    hint.textContent = t('filesSelected', files.length);
  }

  go.addEventListener('click', async () => {
    if (!files.length) return;
    go.disabled = true;
    result.style.display = 'none';
    logEl.style.display = 'block';
    logEl.textContent = t('preparing');
    try {
      const payload = {
        files: await Promise.all(files.map(async (f) => ({ name: f.name, content: await f.text() }))),
        title: document.getElementById('title').value.trim(),
        subtitle: document.getElementById('subtitle').value.trim(),
        tocDepth: Number(document.getElementById('tocDepth').value),
        toc: document.getElementById('toc').checked,
        chapterBreak: document.getElementById('chapterBreak').checked,
        output: document.getElementById('output').value.trim() || null,
      };
      logEl.textContent = t('uploading');
      const r = await fetch('/api/convert', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || t('convFail'));
      logEl.textContent = (j.logs || []).join('\n');
      renderResult(j);
    } catch (e) {
      logEl.textContent = t('errPrefix') + (e.message || e);
    } finally {
      go.disabled = files.length === 0;
    }
  });

  function renderResult(j) {
    result.style.display = 'block';
    result.innerHTML = '';
    const ok = document.createElement('div'); ok.className = 'ok';
    ok.textContent = j.savedTo ? t('okSaved', j.savedTo) : t('okSize', Math.round(j.size / 1024));
    result.appendChild(ok);
    const actions = document.createElement('div'); actions.className = 'actions';

    if (j.savedTo) {
      const open = document.createElement('button'); open.className = 'btn ghost'; open.textContent = t('openPdf');
      open.onclick = () => fetch('/api/open?path=' + encodeURIComponent(j.savedTo));
      const folder = document.createElement('button'); folder.className = 'btn ghost'; folder.textContent = t('openFolder');
      folder.onclick = () => fetch('/api/open?path=' + encodeURIComponent(j.savedTo.replace(/[\\/][^\\/]+$/, '')));
      actions.append(open, folder);
    }
    const dl = document.createElement('button'); dl.className = 'btn ghost'; dl.textContent = t('downloadPdf');
    dl.onclick = () => { window.location.href = '/api/download?id=' + j.id; };
    actions.appendChild(dl);
    result.appendChild(actions);
  }

  // ---- 设置弹窗 ----
  const settingsMask = document.getElementById('settingsMask');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsClose = document.getElementById('settingsClose');
  const closeBehaviorSel = document.getElementById('closeBehavior');
  const langSel = document.getElementById('languageSel');
  const themeSel = document.getElementById('themeSel');

  settingsBtn.addEventListener('click', () => settingsMask.classList.add('open'));
  settingsClose.addEventListener('click', () => settingsMask.classList.remove('open'));
  settingsMask.addEventListener('click', (e) => { if (e.target === settingsMask) settingsMask.classList.remove('open'); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && settingsMask.classList.contains('open')) settingsMask.classList.remove('open'); });

  function postSettings(patch) {
    return fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patch),
    }).catch(() => {});
  }

  themeSel.addEventListener('change', () => { applyTheme(themeSel.value, true); });

  closeBehaviorSel.addEventListener('change', () => {
    postSettings({ closeBehavior: closeBehaviorSel.value });
  });

  langSel.addEventListener('change', async () => {
    const v = langSel.value === 'en' ? 'en' : 'zh';
    await postSettings({ language: v });
    applyLang(v);
    if (window.folio && window.folio.setLanguage) window.folio.setLanguage(v);
  });

  // ---- 初始化：读取设置（主题 + 语言 + 关闭行为），再应用 ----
  (async () => {
    let savedTheme = null;
    try {
      const r = await fetch('/api/settings');
      const j = await r.json();
      if (j.ok && j.settings) {
        if (j.version) {
          const verEl = document.getElementById('appVersion');
          if (verEl) verEl.textContent = 'v' + j.version;
        }
        if (j.settings.closeBehavior === 'tray' || j.settings.closeBehavior === 'quit') {
          closeBehaviorSel.value = j.settings.closeBehavior;
        }
        if (j.settings.language === 'en' || j.settings.language === 'zh') {
          cur = j.settings.language;
        }
        if (['system', 'light', 'dark'].includes(j.settings.theme)) savedTheme = j.settings.theme;
      }
    } catch (_) {}
    if (!savedTheme) { try { savedTheme = localStorage.getItem(THEME_KEY); } catch (_) {} }
    applyTheme(savedTheme, false);   // 服务端设置为准，取不到时沿用首屏脚本用过的缓存值
    applyLang(cur);
  })();
})();
</script>
</body>
</html>
